# Infraestructura opcional para el modo "real": MySQL legacy + MongoDB.
# Uso: docker compose up -d
#   MYSQL_URL=mysql://stagepass:stagepass@localhost:3307/stagepass_legacy
#   MONGO_URL=mongodb://localhost:27018
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stagepass_legacy
      MYSQL_USER: stagepass
      MYSQL_PASSWORD: stagepass
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
